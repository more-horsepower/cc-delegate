name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Tier 1: Pure unit tests — no opencode, no inference, no network
  # ===========================================================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests (excluding live)
        run: uv run --python ${{ matrix.python-version }} --with pytest pytest tests/ -v -m "not live" --tb=short

  # ===========================================================================
  # Tier 2+3: Live contract tests — real opencode binary, mock provider
  # (no real inference)
  # ===========================================================================
  live-contract:
    name: Live Contract Tests (opencode ${{ matrix.opencode-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against latest stable AND dev to catch upcoming breaking changes
        opencode-version: ["latest", "dev"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install opencode
        run: |
          if [ "${{ matrix.opencode-version }}" = "dev" ]; then
            curl -fsSL https://opencode.ai/install | OPENCODE_INSTALL_DIR=$HOME/.opencode/bin bash -s -- --channel dev
          else
            curl -fsSL https://opencode.ai/install | OPENCODE_INSTALL_DIR=$HOME/.opencode/bin bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode
        run: opencode --version

      - name: Run live contract tests
        run: uv run --python 3.14 --with pytest pytest tests/ -v -m live --tb=short
        timeout-minutes: 10
        continue-on-error: ${{ matrix.opencode-version == 'dev' }}

  # ===========================================================================
  # Summary job for branch protection
  # ===========================================================================
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [unit-tests, live-contract]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          # live-contract is allowed to have dev failures (continue-on-error)
          if [ "${{ needs.live-contract.result }}" != "success" ]; then
            echo "Live contract tests failed"
            exit 1
          fi
          echo "All required checks passed"
